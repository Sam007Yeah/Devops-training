services:
    backend:
        build: .
        ports:
            - "5000:5000"
        environment:
            - PORT=5000
            - APP_ENV=development
        depends_on:
            - database

    database:
        image: postgres:16
        environment:
            POSTGRES_USER: devops
            POSTGRES_PASSWORD: devops
            POSTGRES_DB: devopsdb
        volumes:
            - postgres-data:/var/lib/postgresql/data
    volumes:
        postgres-data:
